name: release

# Push a tag and the exes build themselves:
#   git tag v0.1.1 && git push origin v0.1.1
# Assets land on the matching GitHub release. Runs on workflow_dispatch too,
# which builds and uploads artifacts without touching releases — useful for
# checking a build before committing to a version number.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # .npmrc pins flat peer resolution; npm ci honours it
      - run: npm ci

      # --publish never: with a tag present electron-builder would otherwise try
      # to publish the release itself and fail for want of a token. Publishing is
      # the explicit step below.
      - run: npm run dist -- --publish never

      # Kept for workflow_dispatch runs, where there's no release to attach to
      - uses: actions/upload-artifact@v7
        with:
          name: frost-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        # bash, not the default PowerShell: PowerShell does not expand globs
        # into arguments for native commands, so dist/*.exe would reach gh
        # as a literal string
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # latest.yml and the blockmaps are what a running Frost reads to find
          # this release: the yml carries the version and the installer's sha512,
          # the blockmap lets it download only the changed blocks. Without them
          # the exes are here but no installed copy ever learns about them.
          assets=(dist/*.exe dist/latest.yml dist/*.blockmap)

          # The release body is the version's own CHANGELOG section: what
          # changed, written for the people it changed for. --generate-notes
          # lists the commits instead, which is the wrong thing to hand someone
          # who clicked "Release notes" in the update panel. Everything from the
          # version's heading down to the next one, and nothing else.
          awk -v v="## ${TAG#v} " '$0 ~ "^" v {f=1; next} f && /^## /{exit} f' \
            CHANGELOG.md > notes.md

          # A tag pushed before its section was written still gets a release,
          # with the commit list rather than an empty page.
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            echo "no CHANGELOG section for ${TAG#v} - generated notes instead" >&2
            notes=(--generate-notes)
          fi

          # Idempotent: a release may already exist if it was cut by hand, and
          # re-running the job must not fail on that. Its body is left as it is:
          # whoever wrote it meant what it says.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Frost $TAG" \
              "${notes[@]}"
          fi
